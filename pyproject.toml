[project]
name = "WereadExport"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "selenium>=4.52.0",
]

[project.scripts]
weread-export = "weread_export.__main__:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weread_export"]
